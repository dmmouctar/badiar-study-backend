spring.application.name=badiar-study
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management?useSSL=false&serverTimezone=Africa/Conakry&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:BadiarStudy2025SecretKeyPourJWT!}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads/photos}

app.super-admin.email=${SUPER_ADMIN_EMAIL:superadmin@badiar.com}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:BadiarAdmin@2025!}
app.super-admin.first-name=${SUPER_ADMIN_FIRST_NAME:Super}
app.super-admin.last-name=${SUPER_ADMIN_LAST_NAME:Admin}